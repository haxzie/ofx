packages:
  - "packages/*"
  - "apps/*"

# just-bash pulls these in for its Node build only; we use its browser build.
allowBuilds:
  '@mongodb-js/zstd': false
  esbuild: true
  node-liblzma: false
  # @huggingface/transformers pulls these in for Node; the browser build uses
  # onnxruntime-web, which needs no native step.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.1.1'
