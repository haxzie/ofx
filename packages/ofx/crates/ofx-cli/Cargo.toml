[package]
name = "ofx-cli"
description = "ofx — an open coding agent. Native CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ofx"
path = "src/main.rs"

[dependencies]
ofx-core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
glob = "0.3"
rustyline = "18"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["rt", "macros", "process", "fs", "io-std", "signal"] }
